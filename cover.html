<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watch &amp; Chill cover</title>
<!-- render source for cover.png (1920x640). Composition is centre-weighted: Notion crops covers to a wide strip. -->
<style>
:root{--ink:#0a090b;--velvet:#7d0f21;--velvet-2:#4a0812;--gold:#e9b949;--gold-hi:#ffe08a;--gold-lo:#a8761c}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:var(--ink);overflow:hidden}
.c{position:relative;width:100vw;height:100vh;overflow:hidden;
  background:radial-gradient(90% 120% at 50% 0%,#2e1b24 0%,#16111a 40%,var(--ink) 80%)}
.beam{position:absolute;top:-10%;width:40%;height:130%;transform-origin:50% 0;mix-blend-mode:screen;
  background:conic-gradient(from 180deg at 50% 0%,transparent 158deg,rgba(255,224,138,.22) 174deg,rgba(255,224,138,.04) 180deg,rgba(255,224,138,.22) 186deg,transparent 202deg)}
.l{left:12%;transform:rotate(-12deg)}.r{right:12%;transform:rotate(12deg)}.m{left:30%;width:40%;opacity:.55}
.curtain{position:absolute;top:0;bottom:0;width:13%;
  background:repeating-linear-gradient(90deg,var(--velvet-2) 0 6%,var(--velvet) 11%,#a3162d 14%,var(--velvet) 17%,var(--velvet-2) 22%)}
.curtain::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.6),transparent 30%,transparent 70%,rgba(0,0,0,.55))}
.cl{left:0;border-right:3px solid rgba(233,185,73,.4)}.cr{right:0;border-left:3px solid rgba(233,185,73,.4)}
/* centre film strip band */
.band{position:absolute;left:13%;right:13%;top:50%;height:34%;transform:translateY(-50%);
  background:
    radial-gradient(circle 7px at 50% 50%,#000 96%,transparent) 0 8%/46px 22px repeat-x,
    radial-gradient(circle 7px at 50% 50%,#000 96%,transparent) 0 92%/46px 22px repeat-x,
    repeating-linear-gradient(90deg,transparent 0 180px,#050506 180px 196px),
    linear-gradient(90deg,#3a1520,#1b1830 25%,#33281a 50%,#10242c 75%,#3a1520);
  opacity:.5;border-top:2px solid rgba(233,185,73,.25);border-bottom:2px solid rgba(233,185,73,.25)}
.floor{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(180deg,transparent,#000 90%)}
.grain{position:absolute;inset:0;opacity:.12;mix-blend-mode:overlay;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 220px rgba(0,0,0,.85)}
</style>
</head>
<body>
<div class="c">
  <div class="beam l"></div><div class="beam r"></div><div class="beam m"></div>
  <div class="band"></div>
  <div class="curtain cl"></div><div class="curtain cr"></div>
  <div class="floor"></div><div class="grain"></div><div class="vig"></div>
</div>
</body>
</html>
