<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watch &amp; Chill</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@1,500&display=swap');
:root{
  --ink:#0a090b; --ink-2:#14111a; --velvet:#7d0f21; --velvet-2:#4a0812;
  --gold:#e9b949; --gold-hi:#ffe08a; --gold-lo:#a8761c; --ivory:#f4ecd8; --play:#e0243f;
  --display:'Bebas Neue','Oswald','Arial Narrow',Impact,sans-serif;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);overflow:hidden}
.hero{position:relative;width:100vw;height:100vh;min-height:220px;overflow:hidden;isolation:isolate;
  background:radial-gradient(120% 90% at 50% 0%,#2a1a22 0%,var(--ink-2) 38%,var(--ink) 75%);
  font-family:var(--serif);color:var(--ivory)}

/* spotlight beams */
.beam{position:absolute;top:-20%;width:46%;height:150%;transform-origin:50% 0;mix-blend-mode:screen;opacity:.5;z-index:0;
  background:conic-gradient(from 180deg at 50% 0%,transparent 160deg,rgba(255,224,138,.20) 175deg,rgba(255,224,138,.05) 180deg,rgba(255,224,138,.20) 185deg,transparent 200deg);
  animation:sweep 14s ease-in-out infinite alternate}
.beam.l{left:8%;--a:-9deg;--b:7deg}
.beam.r{right:8%;--a:9deg;--b:-7deg;animation-delay:-6s}
@keyframes sweep{from{transform:rotate(var(--a))}to{transform:rotate(var(--b))}}

/* curtains */
.curtain{position:absolute;top:0;bottom:0;width:11%;z-index:3;
  background:repeating-linear-gradient(90deg,var(--velvet-2) 0 6%,var(--velvet) 11%,#a3162d 14%,var(--velvet) 17%,var(--velvet-2) 22%);
  box-shadow:inset 0 -30px 40px rgba(0,0,0,.55)}
.curtain.l{left:0;border-right:2px solid rgba(233,185,73,.35);transform-origin:0 0;animation:sway 9s ease-in-out infinite alternate}
.curtain.r{right:0;border-left:2px solid rgba(233,185,73,.35);transform-origin:100% 0;animation:sway 9s ease-in-out infinite alternate-reverse}
@keyframes sway{from{transform:skewX(-.8deg)}to{transform:skewX(.8deg)}}
.curtain::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.65),transparent 22%)}

/* marquee frame + chasing bulbs */
.frame{position:absolute;inset:7% 14% 17% 14%;z-index:2;border:2px solid var(--gold-lo);border-radius:10px;
  box-shadow:0 0 0 1px rgba(0,0,0,.6),inset 0 0 40px rgba(0,0,0,.7),0 0 24px rgba(233,185,73,.12)}
.bulbs{position:absolute;pointer-events:none;
  --bulb:radial-gradient(circle,var(--gold-hi) 0 28%,rgba(233,185,73,.55) 34%,transparent 46%)}
.bulbs.h{left:0;right:0;height:14px;background:var(--bulb) 0 0/26px 14px repeat-x}
.bulbs.v{top:0;bottom:0;width:14px;background:var(--bulb) 0 0/14px 26px repeat-y}
.bulbs.t{top:-8px}.bulbs.b{bottom:-8px}.bulbs.lf{left:-8px}.bulbs.rt{right:-8px}
.bulbs.alt{background-position:13px 0;animation:chase 1.4s steps(1) infinite}
.bulbs.v.alt{background-position:0 13px}
.bulbs:not(.alt){animation:chase 1.4s steps(1) infinite reverse}
@keyframes chase{0%{opacity:1}50%{opacity:.18}100%{opacity:1}}

/* title block */
.title{position:absolute;inset:7% 14% 17% 14%;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.2vh}
.now{font:400 clamp(9px,1.9vw,17px)/1 var(--display);letter-spacing:.42em;color:var(--ivory);display:flex;align-items:center;gap:.9em;opacity:.92}
.now i{width:.7em;height:.7em;border-radius:50%;background:var(--play);box-shadow:0 0 10px var(--play);animation:rec 1.8s ease-in-out infinite}
@keyframes rec{50%{opacity:.25}}
h1{font:400 clamp(30px,10.5vw,118px)/.9 var(--display);letter-spacing:.04em;
  background:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 46%,var(--gold-lo) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 12px rgba(233,185,73,.35));animation:flicker 7s linear infinite}
h1 b{font-weight:400;color:var(--play);-webkit-text-fill-color:var(--play)}
@keyframes flicker{0%,92%,100%{opacity:1}93%{opacity:.78}94%{opacity:1}96%{opacity:.86}97%{opacity:1}}
.sub{font:italic 500 clamp(10px,2.1vw,19px)/1.3 var(--serif);color:var(--gold);letter-spacing:.06em}
.sub s{text-decoration:none;color:var(--ivory);opacity:.55;padding:0 .6em}

/* ticket stub */
.ticket{position:absolute;right:15.5%;bottom:21%;z-index:5;transform:rotate(-6deg);
  font:400 clamp(7px,1.15vw,11px)/1.25 var(--display);letter-spacing:.2em;color:var(--ink);text-align:center;
  padding:.7em 1.6em .7em 1.1em;background:linear-gradient(90deg,var(--ivory) 0 78%,#e3d6b4 78% 100%);border-radius:4px;
  -webkit-mask:radial-gradient(circle .45em at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle .45em at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle .45em at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle .45em at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat;
  box-shadow:0 6px 16px rgba(0,0,0,.5)}
.ticket strong{display:block;font-size:1.5em;letter-spacing:.14em;color:var(--velvet)}

/* film strip */
.strip{position:absolute;left:0;right:0;bottom:0;height:13%;min-height:34px;z-index:4;overflow:hidden;background:#050506;border-top:1px solid rgba(233,185,73,.25)}
.reel{position:absolute;inset:0 -200px 0 0;width:calc(100% + 400px);animation:roll 22s linear infinite;
  background:
    radial-gradient(circle 4px at 50% 50%,#000 96%,transparent) 0 12% / 34px 14px repeat-x,
    radial-gradient(circle 4px at 50% 50%,#000 96%,transparent) 0 88% / 34px 14px repeat-x,
    repeating-linear-gradient(90deg,transparent 0 120px,#050506 120px 132px),
    linear-gradient(90deg,#3a1520,#1b1830 25%,#33281a 50%,#10242c 75%,#3a1520)}
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:22%;background:repeating-linear-gradient(90deg,#14131a 0 14px,transparent 14px 34px)}
.reel::before{top:5%}.reel::after{bottom:5%}
@keyframes roll{to{transform:translateX(-132px)}}

/* grain + vignette */
.grain{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:.10;mix-blend-mode:overlay;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.vig{position:absolute;inset:0;z-index:6;pointer-events:none;box-shadow:inset 0 0 14vw rgba(0,0,0,.8)}

@media (max-height:340px){.ticket{display:none}}
@media (max-width:560px){.ticket{display:none}.curtain{width:7%}.frame,.title{inset:8% 9% 18% 9%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<section class="hero" aria-label="Watch &amp; Chill — your personal cinema">
  <div class="beam l"></div><div class="beam r"></div>
  <div class="curtain l"></div><div class="curtain r"></div>
  <div class="frame" aria-hidden="true">
    <div class="bulbs h t"></div><div class="bulbs h t alt"></div>
    <div class="bulbs h b"></div><div class="bulbs h b alt"></div>
    <div class="bulbs v lf"></div><div class="bulbs v lf alt"></div>
    <div class="bulbs v rt"></div><div class="bulbs v rt alt"></div>
  </div>
  <div class="title">
    <div class="now"><i></i>NOW SHOWING</div>
    <h1>WATCH <b>&amp;</b> CHILL</h1>
    <p class="sub">Movies<s>·</s>Series<s>·</s>Anime<s>·</s>Your personal cinema</p>
  </div>
  <div class="ticket" aria-hidden="true"><strong>ADMIT ONE</strong>PREMIERE · SEAT A1</div>
  <div class="strip" aria-hidden="true"><div class="reel"></div></div>
  <div class="grain"></div><div class="vig"></div>
</section>
</body>
</html>
